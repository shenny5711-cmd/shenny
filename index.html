<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2438">
<title>念佛計數器</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>

<header class="topbar">
  <div class="brand">念佛計數器</div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="counter">計數</button>
    <button class="tab-btn" data-tab="stats">統計</button>
    <button class="tab-btn" data-tab="mantras">佛號設定</button>
    <button class="tab-btn" data-tab="texts">法本</button>
  </nav>
  <div class="auth-status">
    <span id="authLabel">未登入</span>
    <button class="btn btn-secondary" id="btnAuthOpen">登入</button>
  </div>
</header>

<main>

  <!-- 計數頁 -->
  <section id="tab-counter" class="tab-panel active">
    <div class="mantra-select-row" id="mantraChips"></div>

    <div class="counter-stage" id="counterStage">
      <div class="count-display" id="countDisplay">0</div>
      <div class="session-hint" id="sessionHint">點擊圓形按鈕開始計數</div>
      <button class="tap-circle" id="tapCircle" aria-label="計數">敲</button>
    </div>

    <div class="counter-actions">
      <button class="btn btn-secondary" id="btnManual">手動輸入</button>
      <button class="btn btn-secondary" id="btnLock">鎖定模式</button>
      <button class="btn btn-primary" id="btnEndSession" disabled>結束本次</button>
    </div>
  </section>

  <!-- 統計頁 -->
  <section id="tab-stats" class="tab-panel">
    <div class="mantra-select-row" id="statsMantraChips"></div>
    <div class="stats-summary" id="statsSummary"></div>
    <div class="stats-groups">
      <div class="stats-group">
        <h3>每日</h3>
        <div id="dailyList" class="stats-list"></div>
      </div>
      <div class="stats-group">
        <h3>每週</h3>
        <div id="weeklyList" class="stats-list"></div>
      </div>
      <div class="stats-group">
        <h3>每月</h3>
        <div id="monthlyList" class="stats-list"></div>
      </div>
    </div>
  </section>

  <!-- 佛號設定頁 -->
  <section id="tab-mantras" class="tab-panel">
    <div id="mantraList" class="mantra-list"></div>
    <button class="btn btn-primary" id="btnAddMantra">+ 新增佛號 / 咒語</button>
  </section>

  <!-- 法本頁 -->
  <section id="tab-texts" class="tab-panel">
    <div id="textList" class="mantra-list"></div>
  </section>

</main>

<!-- 法本 PDF 檢視器 -->
<div id="pdfViewer" class="pdf-viewer hidden">
  <div class="pdf-viewer-bar">
    <span id="pdfViewerTitle"></span>
    <button class="btn btn-secondary" id="pdfViewerClose">關閉</button>
  </div>
  <iframe id="pdfViewerFrame" class="pdf-viewer-frame"></iframe>
</div>

<!-- 鎖定模式全螢幕遮罩 -->
<div id="lockOverlay" class="lock-overlay hidden">
  <div class="lock-count" id="lockCount">0</div>
  <div class="lock-hint">輕觸畫面計數</div>
  <button class="lock-exit" id="lockExit">長按 2 秒解除鎖定</button>
</div>

<!-- 手動輸入 modal -->
<div id="manualModal" class="modal hidden">
  <div class="modal-card">
    <h3>手動輸入紀錄</h3>
    <label>佛號 / 咒語
      <select id="manualMantra"></select>
    </label>
    <label>次數
      <input type="number" id="manualCount" min="1" value="1">
    </label>
    <label>日期
      <input type="date" id="manualDate">
    </label>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="manualCancel">取消</button>
      <button class="btn btn-primary" id="manualSave">儲存</button>
    </div>
  </div>
</div>

<!-- 登入 / 註冊 modal -->
<div id="authModal" class="modal hidden">
  <div class="modal-card">
    <h3>登入同步</h3>
    <p style="color:var(--text-dim); font-size:0.85rem; margin:0;">在所有裝置用同一組帳號密碼登入，念佛紀錄就會自動同步。不用是真的信箱，自己記得住就好。</p>
    <label>Email
      <input type="email" id="authEmail" autocomplete="username">
    </label>
    <label>密碼
      <input type="password" id="authPassword" autocomplete="current-password" placeholder="至少 6 碼">
    </label>
    <div id="authError" style="color:var(--danger); font-size:0.85rem; min-height:1.2em;"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="authCancel">取消</button>
      <button class="btn btn-secondary" id="authSignUp">註冊新帳號</button>
      <button class="btn btn-primary" id="authSignIn">登入</button>
    </div>
  </div>
</div>

<!-- 新增/編輯佛號 modal -->
<div id="mantraModal" class="modal hidden">
  <div class="modal-card">
    <h3 id="mantraModalTitle">新增佛號</h3>
    <label>名稱
      <input type="text" id="mantraName" placeholder="例如：南無阿彌陀佛">
    </label>
    <label>發願總數（選填，0 表示不設定）
      <input type="number" id="mantraTarget" min="0" value="0">
    </label>
    <label>顏色
      <input type="color" id="mantraColor" value="#8b5a2b">
    </label>
    <label>法照（選填，會顯示在計數大圓上）
      <input type="file" id="mantraImage" accept="image/*">
    </label>
    <div class="mantra-image-preview-row">
      <img id="mantraImagePreview" class="mantra-image-preview hidden">
      <button type="button" class="btn btn-secondary hidden" id="mantraImageRemove">移除法照</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="mantraCancel">取消</button>
      <button class="btn btn-danger hidden" id="mantraDelete">刪除</button>
      <button class="btn btn-primary" id="mantraSave">儲存</button>
    </div>
  </div>
</div>

<script src="js/db.js?v=11"></script>
<script src="js/text-library.js?v=11"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=11"></script>
<script src="js/sync.js?v=11"></script>
<script src="js/app.js?v=11"></script>
</body>
</html>
